<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>
    <style>
        body {
            background-color: #FFB6C1; /* Rosa claro */
            color: white;              /* Texto en blanco */
            font-family: Arial, sans-serif;
            text-align: center;        /* Centra el texto y el reproductor */
        }

        .video-container {
            margin-top: 20px;
        }

        iframe {
            max-width: 100%;
            border-radius: 10px;        /* Bordes suavemente redondeados */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Sombra decorativa */
        }
    </style>
</head>
<body>

    <h1>¡Hola, mundo!</h1>
    <h2>Macarena Moscoso Martín</h2>
    <p>Este es el contenido principal de la página web.</p>

    <!-- Video de YouTube incrustado -->
    <div class="video-container">
        <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/GEkKFVafU9I" 
            title="Reproductor de vídeo de YouTube" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
